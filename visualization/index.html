<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climate Digital Twin</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- Location panel -->
    <div id="location-panel">

    <div class="title">📍 Selected Location</div>

    <div class="coordinate">
        Latitude:
        <span id="lat">--</span>
    </div>

    <div class="coordinate">
        Longitude:
        <span id="lon">--</span>
    </div>

    <div class="country">
        Country:
        <span id="country">--</span>
    </div>

    <div class="divider"></div>

    <div class="climate-title">
        🌡 Climate Data
    </div>

    <div class="climate-item">
        Temperature:
        <span id="temperature">--</span>
    </div>

    <div class="climate-item">
        Rainfall:
        <span id="rainfall">--</span>
    </div>

    <div class="climate-item">
        CO₂:
        <span id="co2">--</span>
    </div>

</div>

    <script type="module" src="./src/main.js"></script>

</body>
</html>
